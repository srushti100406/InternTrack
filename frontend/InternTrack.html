async function load(){S.loading=true;S.error="";render();try{S.apps=await svc.getApplications()}catch(e){S.error=e.message}S.loading=false;render()}
function filtered(q,fs,fd,fl,sort){let r=S.apps.filter(a=>(a.companyName+" "+a.role).toLowerCase().includes(q.toLowerCase())&&(fs=="all"||a.status==fs)&&(fl=="all"||a.location==fl));
 if(fd!="all")r=r.filter(a=>{const n=dl(a.deadline);return fd=="none"?n==null:n!=null&&(fd=="over"?n<0:fd=="7"?n>=0&&n<=7:n>=0&&n<=30)});
 const dv=a=>a.deadline?new Date(a.deadline).getTime():9e15;
 return r.sort((a,b)=>sort=="old"?a.createdAt.localeCompare(b.createdAt):sort=="due"?dv(a)-dv(b):b.createdAt.localeCompare(a.createdAt))}

 else{const cols=S.fs!="all"&&!PIPE.includes(S.fs)?[S.fs]:PIPE;body=`<div class="kan" style="grid-template-columns:repeat(${cols.length},minmax(220px,1fr))">${cols.map(s=>{const c=list.filter(a=>a.status==s);return`<div class="col" data-drop="${s}"><h4>${ST[s]}<span class="mut">${c.length}</span></h4>${c.map(a=>`<div class="kc" draggable="true" data-drag="${a.id}" data-act="open" data-id="${a.id}"><div class="co">${logo(a.companyName)}<div><b>${esc(a.companyName)}</b><span class="mut">${esc(a.role)}</span></div></div><div class="row between" style="margin-top:8px"><span class="mut">${a.deadline?fmt(a.deadline):"No deadline"}</span>${a.deadline&&active(a)?urg(a.deadline):""}</div>${a.nextAction?`<div class="mut" style="margin-top:6px">→ ${esc(a.nextAction)}</div>`:""}</div>`).join("")||`<div class="mut" style="padding:12px;text-align:center">Drop here</div>`}</div>`}).join("")}</div>${S.fs=="all"?`<p class="mut">Rejected and withdrawn applications are available via the status filter.</p>`:""}`}
 return`<div class="wrap"><div class="row between"><div><h1 class="h1">${pipe?"Pipeline":"My Applications"}</h1><p class="sub">${pipe?"Drag cards between stages to update their status.":"Manage every opportunity in one place."}</p></div><button class="btn p" data-act="add">${ic("plus")} Add Application</button></div>

function landing(){const F=[["brief","Application tracking","Keep every role, link and note in one searchable place."],["kan","Visual pipeline","Drag applications from Saved all the way to Offer."],["clock","Smart reminders","Never miss a deadline or a follow-up."],["cal","Calendar","Deadlines, assessments and interviews together."],["chart","Analytics","See conversion rates from your real data."]];
return`<nav class="pn"><div class="pw row between">${logoH}<div class="row" style="gap:4px">${themeToggle()}<a href="#" data-act="scroll" data-s="features">Features</a><a href="#" data-act="scroll" data-s="how">How It Works</a><button class="btn" data-act="route" data-r="login">Sign In</button></div></div></nav>
<section class="pw hero"><div><h1>Your Internship Journey, All in One Place.</h1><p>Manage applications, deadlines, interviews and offers without spreadsheets or lost emails.</p><div class="row"><button class="btn p big" data-act="route" data-r="register">Get Started Free</button><button class="btn big" data-act="demo">Explore Dashboard</button></div></div>${prev()}</section>
<section class="pw" id="features"><h2>Everything you need to land the offer</h2><div class="fgrid">${F.map(f=>`<div class="card pad"><div style="background:var(--bs);color:var(--blue);width:38px;height:38px;border-radius:10px;display:grid;place-items:center">${ic(f[0])}</div><h3>${f[1]}</h3><p class="mut">${f[2]}</p></div>`).join("")}</div></section>
<section class="pw" id="how"><h2>How it works</h2><div class="fgrid three">${[["1","Add your applications","Save roles you’re eyeing or have already applied to."],["2","Track every stage","Move cards through the pipeline as things progress."],["3","Act on what’s next","Follow deadlines and next actions from your dashboard."]].map(s=>`<div class="card pad"><span class="lg" style="background:var(--blue)">${s[0]}</span><h3>${s[1]}</h3><p class="mut">${s[2]}</p></div>`).join("")}</div></section>
<section class="pw"><div class="card pad cta"><h2>Ready to organize your search?</h2><button class="btn p big" data-act="route" data-r="register">Get Started Free</button></div></section>
<footer class="pw pf"><span>© 2026 InternTrack</span><span class="mut">Prototype: backend not connected</span></footer>`}
const RT=(r,t)=>`<a href="#" data-act="route" data-r="${r}">${t}</a>`;
const AU={login:{t:"Welcome back.",b:"Sign In",f:[["email","Email","email"],["password","Password","password"]],x:`<div class="row between" style="margin-bottom:14px"><label style="font-weight:400;margin:0"><input type="checkbox" name="remember" style="width:auto"> Remember me</label>${RT("forgot","Forgot password?")}</div>`,l:`New here? ${RT("register","Create an account")}`},
register:{t:"Start organizing your internship journey.",b:"Create Account",f:[["name","Full name","text"],["email","Email","email"],["password","Password","password"],["confirm","Confirm password","password"]],x:`<label style="font-weight:400"><input type="checkbox" name="terms" style="width:auto"> I accept the Terms and Privacy Policy</label><div class="err" data-e="terms"></div><div style="height:12px"></div>`,l:`Already have an account? ${RT("login","Sign in")}`},
forgot:{t:"Forgot your password?",b:"Send reset link",f:[["email","Email","email"]],l:RT("login","Back to sign in")},
reset:{t:"Set a new password",b:"Update password",f:[["password","New password","password"],["confirm","Confirm password","password"]],l:RT("login","Back to sign in")}};
function authv(r){const c=AU[r];return`<div class="split"><div class="sl"><div><div class="row between">${logoH}${themeToggle()}</div><form data-auth="${r}" novalidate><h1>${c.t}</h1><div class="err box" data-e="form"></div>${c.f.map(f=>`<div class="f"><label>${f[1]}</label><div class="pwr"><input name="${f[0]}" type="${f[2]}">${f[2]=="password"?`<button type="button" class="ib" data-act="eye" tabindex="-1" aria-label="Show or hide password">${ic("eye")}</button>`:""}</div><div class="err" data-e="${f[0]}"></div></div>`).join("")}${c.x||""}<button class="btn p big" style="width:100%;justify-content:center;margin-top:6px">${c.b}</button><p class="mut" style="text-align:center">${c.l}</p><p class="mut" style="font-size:11px;text-align:center">Prototype: no backend is connected, so nothing is sent, checked or stored.</p></form></div></div><div class="sr">${prev()}</div></div>`}
function onboard(){const s=S.obs,B=(w,t,c="")=>`<button class="btn ${c}" data-act="ob" data-w="${w}">${t}</button>`,I=(l,p)=>`<div class="f" style="margin-bottom:10px"><label>${l}</label><input placeholder="${p}"></div>`;
 const body=[`<h2>Welcome to InternTrack</h2><p class="mut">Let’s set up your tracker in under a minute.</p>`,`<h2>What are you looking for?</h2><p class="mut">All optional. Skip anything you like.</p>${I("Target roles","e.g. Software, Data Analyst")}${I("Preferred locations","e.g. Bengaluru, Remote")}${I("Interests","e.g. Cloud, AI, Frontend")}`,`<h2>How would you like to start?</h2><div class="row" style="margin-top:14px">${B("add","Add an existing application")}${B("empty","Start with an empty tracker")}</div>`,`<h2>Quick tour</h2><ul class="mut"><li>Dashboard: stats, deadlines and next actions.</li><li>Pipeline: drag cards between stages.</li><li>My Applications: search, filter and edit.</li></ul>`][s];
 return`<div class="ob"><div class="card obc"><div class="row between"><div class="dots" style="flex:1;margin-right:12px">${[0,1,2,3].map(i=>`<i class="${i<=s?"on":""}"></i>`).join("")}</div>${themeToggle()}</div>${body}<div class="row between" style="margin-top:24px">${B("skip","Skip")}<div class="row">${s>0?B("back","Back"):""}${s<2?B("next","Next","p"):s==3?B("fin","Go to dashboard","p"):""}</div></div></div></div>`}
function pub(){const r=S.route;return`<div class="pub">${r=="landing"?landing():r=="onboard"?onboard():authv(r)}</div>`}
async function authApi(k,d){if(!API_BASE_URL){await wait(600);return}const r=await fetch(API_BASE_URL+"/auth/"+k,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw new Error(r.status==401?"Incorrect email or password.":"Request failed ("+r.status+")")}
async function auth(k,form){const d=Object.fromEntries(new FormData(form)),e={};
 if(k=="register"&&!d.name.trim())e.name="Enter your full name.";
 if(k!="reset"&&!/^\S+@\S+\.\S+$/.test(d.email||""))e.email="Enter a valid email address.";
 if(k!="forgot"&&(d.password||"").length<(k=="login"?1:8))e.password=k=="login"?"Enter your password.":"Use at least 8 characters.";
 if((k=="register"||k=="reset")&&d.confirm!==d.password)e.confirm="Passwords don’t match.";
 if(k=="register"&&!d.terms)e.terms="Please accept the terms to continue.";
 form.querySelectorAll("[data-e]").forEach(n=>n.textContent=e[n.dataset.e]||"");
 if(Object.keys(e).length)return;
 const b=form.querySelector(".btn.p");b.disabled=true;b.textContent="Please wait…";
 try{await authApi(k,d);if(!API_BASE_URL)toast("Demo mode: nothing was sent or stored");
  if(k=="login"){S.route="app";S.page="dash"}else if(k=="register"){S.obs=0;S.route="onboard"}else if(k=="reset")S.route="login";else if(!API_BASE_URL)S.route="reset";else toast("Check your inbox for a reset link");
  render()}catch(x){form.querySelector("[data-e=form]").textContent=x.message;b.disabled=false;b.textContent=AU[k].b}}
// ---------- events ----------
async function save(id,form){const d=Object.fromEntries(new FormData(form));const err={};
 if(!d.companyName.trim())err.companyName="Company name is required.";if(!d.role.trim())err.role="Job role is required.";
 if(d.jobUrl&&!/^https?:\/\/.+\..+/.test(d.jobUrl))err.jobUrl="Enter a valid URL starting with http(s)://";
 const dup=d.jobUrl&&S.apps.find(a=>a.jobUrl===d.jobUrl&&a.id!==id);
 if(dup&&!S.modal.confirmDup){err.dup=`This link already exists (${esc(dup.companyName)} — ${esc(dup.role)}). Press Save again to add it anyway.`;S.modal.confirmDup=true}
 if(Object.keys(err).length){S.modal={...S.modal,data:{...(S.modal.data||{}),...d},err};return render()}
 try{if(id){await svc.updateApplication(id,d);logAct("Updated "+d.companyName)}else{await svc.createApplication({...d,nextActionDone:false});logAct("Added "+d.companyName+" to "+ST[d.status])}
  S.apps=await svc.getApplications();S.modal=null;toast("Application saved");render()}catch(e){toast("Save failed: "+e.message)}}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-act]");if(!t){if(S.menu){S.menu=null;render()}return}
 const act=t.dataset.act,id=t.dataset.id;
 if(act=="closeov"&&e.target!==t&&!e.target.closest("button[data-act=closeov]"))return;
 if(act=="task")return;if(act=="eye"){const i=t.previousElementSibling;i.type=i.type=="password"?"text":"password";return}
 e.target.closest("a")&&e.preventDefault();
 if(act=="go"){S.page=t.dataset.p;S.nav=false;S.menu=null;S.open=null;S.pg=1}
 else if(act=="nav")S.nav=!S.nav;else if(act=="collapse")S.col=!S.col;else if(act=="route"){S.route=t.dataset.r;scrollTo(0,0)}else if(act=="demo"){S.route="app";S.page="dash"}else if(act=="scroll"){document.getElementById(t.dataset.s)?.scrollIntoView({behavior:"smooth"});return}else if(act=="ob"){const w=t.dataset.w;if(w=="back")S.obs--;else if(w=="next")S.obs++;else if(w=="skip"){S.route="app";S.page="dash"}else if(w=="add"||w=="empty"){S.obw=w;S.obs=3}else if(w=="fin"){S.route="app";S.page="dash";if(S.obw=="empty"){db=[];S.apps=[]}if(S.obw=="add")S.modal={type:"form"}}}else if(act=="navx")S.nav=false;
 else if(act=="menu")S.menu=S.menu==t.dataset.m?null:t.dataset.m;
 else if(act=="theme"){Theme.toggle();S.menu=null}
 else if(act=="theme-choice")Theme.set(t.dataset.themeChoice);
 else if(act=="add")S.modal={type:"form"};
 else if(act=="edit")S.modal={type:"form",data:S.apps.find(a=>a.id==id)};
 else if(act=="del")S.modal={type:"del",data:S.apps.find(a=>a.id==id)};
 else if(act=="delok"){try{const a=S.apps.find(x=>x.id==id);await svc.deleteApplication(id);S.apps=await svc.getApplications();logAct("Deleted "+a.companyName);S.modal=null;S.open=null;toast("Application deleted")}catch(x){toast("Delete failed: "+x.message)}}
 else if(act=="open"){S.open=id;S.menu=null}
 else if(act=="closeov"){S.modal?S.modal=null:S.open=null}
 else if(act=="view"){S.view=t.dataset.v}
 else if(act=="pg")S.pg+=+t.dataset.d;
 else if(act=="clear"){S.q="";S.fs=S.fd=S.fl="all"}
 else if(act=="retry")return load();
 render()});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.act=="task"){const a=S.apps.find(x=>x.id==t.dataset.id);await svc.updateApplication(a.id,{nextActionDone:t.checked});a.nextActionDone=t.checked;if(t.checked){logAct("Completed: "+a.nextAction);toast("Task completed")}render()}
 else if(t.dataset.act=="status"){const a=S.apps.find(x=>x.id==t.dataset.id);await svc.updateApplication(a.id,{status:t.value,dateApplied:a.dateApplied||(t.value!="saved"?day(0):"")});a.status=t.value;logAct(`Moved ${a.companyName} to ${ST[t.value]}`);S.apps=await svc.getApplications();toast("Status updated");render()}});
document.addEventListener("input",e=>{const k=e.target.dataset.in;if(!k)return;S[k]=e.target.value;if(k=="gq"){S.q=e.target.value;if(S.page!="apps"&&S.page!="dash")S.page="apps"}S.pg=1;render()});
document.addEventListener("submit",e=>{e.preventDefault();const k=e.target.dataset.auth;if(k)auth(k,e.target);else save(e.target.dataset.form,e.target)});
let dragId=null;
document.addEventListener("dragstart",e=>{dragId=e.target.closest?.("[data-drag]")?.dataset.drag});
document.addEventListener("dragover",e=>{const c=e.target.closest?.("[data-drop]");if(c){e.preventDefault();c.classList.add("over")}});
document.addEventListener("dragleave",e=>e.target.closest?.("[data-drop]")?.classList.remove("over"));
document.addEventListener("drop",async e=>{const c=e.target.closest?.("[data-drop]");if(!c||!dragId)return;e.preventDefault();const a=S.apps.find(x=>x.id==dragId),s=c.dataset.drop;if(a.status!=s){await svc.updateApplication(a.id,{status:s,dateApplied:a.dateApplied||(s!="saved"?day(0):"")});S.apps=await svc.getApplications();logAct(`Moved ${a.companyName} to ${ST[s]}`);toast(`Moved to ${ST[s]}`)}dragId=null;render()});
load();
</script></body></html>
