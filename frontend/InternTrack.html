const API_BASE_URL = "https://cvjwaxr8d5.execute-api.ap-southeast-2.amazonaws.com";

// Any client can send any value, so this does NOT identify or protect a real student.
// Replace it with verified authentication (e.g. a Cognito JWT) before real users access the app.
const DEV_USER_ID = "dev-user-1";
const API_TIMEOUT_MS = 15000;
// Task enum values must match what the Tasks Lambda stores and validates. Adjust here if the backend differs.
const TASK_STATUS = {open:"Pending", progress:"In Progress", done:"Completed", cancelled:"Cancelled"};
const TASK_STATUSES = [TASK_STATUS.open,TASK_STATUS.progress,TASK_STATUS.done,TASK_STATUS.cancelled];
const TASK_TYPES = ["Follow-up","Assessment","Interview","Deadline","Other"];
const RESUME_MAX_SIZE_BYTES = 5 * 1024 * 1024;
const RESUME_CONTENT_TYPES = {".pdf":"application/pdf",".docx":"application/vnd.openxmlformats-officedocument.wordprocessingml.document"};
const day=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
// Sample data used ONLY by the landing/sign-in preview card. The dashboard never reads it.
const DEMO=[["Google","Software Engineering Intern","interview"],["Microsoft","Frontend Developer Intern","assessment"],["Amazon Web Services","Cloud Engineering Intern","offer"],["Flipkart","Data Analyst Intern","applied"],["Razorpay","Frontend Developer Intern","saved"],["Atlassian","Software Engineering Intern","rejected"]].map(r=>({companyName:r[0],role:r[1],status:r[2]}));

// ---------- API client (API Gateway + Lambda) ----------
class ApiError extends Error{constructor(message,status=0,details=null){super(message);this.name="ApiError";this.status=status;this.details=details}}
const HTTP_MSG={400:"The server rejected the request. Check the details and try again.",401:"You’re not authorised to do that.",403:"You’re not authorised to do that.",404:"That record wasn’t found. It may have been deleted.",409:"That conflicts with existing data.",429:"Too many requests. Please wait a moment and try again."};

 if(!API_BASE_URL)throw new ApiError("Backend not configured. Set API_BASE_URL in InternTrack.html to your API Gateway Invoke URL.");
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),API_TIMEOUT_MS);

 if(body!==undefined)headers["Content-Type"]="application/json";

async function uploadResume(file,roleCategory,resumeId=null){
 if(S.resumeBusy)return;
 const contentType=resumeContentType(file);
 if(!roleCategory.trim()){S.resumeError="Enter a role category.";render();return}
 if(!contentType){S.resumeError="Choose a PDF or DOCX file with a matching file type.";render();return}
 if(file.size<=0||file.size>RESUME_MAX_SIZE_BYTES){S.resumeError=`Choose a file between 1 byte and ${resumeFileSize(RESUME_MAX_SIZE_BYTES)}.`;render();return}
 const existing=resumeId&&S.resumes.find(r=>r.resumeId==resumeId);
 if(resumeId&&(!existing||existing.uploadStatus!="pending")){S.resumeError="This resume is no longer waiting for an upload. Refresh and try again.";render();return}
 if(existing&&(existing.fileName!==file.name||existing.fileSize!==file.size||existing.contentType!==contentType)){S.resumeError="For a retry, choose the original filename, type, and file size.";render();return}
 S.resumeBusy=true;S.resumeError="";render();
 let uploadSucceeded=false;
 try{
  const result=resumeId?await svc.updateResume(resumeId,{roleCategory:roleCategory.trim(),fileName:file.name}):await svc.createResume({roleCategory:roleCategory.trim(),fileName:file.name,contentType,fileSize:file.size});

  let url;
  try{url=new URL(uploadUrl)}catch(_){throw new ApiError("The Resumes API returned an invalid upload URL.")}
  if(url.protocol!=="https:")throw new ApiError("The upload URL must use HTTPS.");
  let uploadResponse;
  try{uploadResponse=await fetch(uploadUrl,{method:"PUT",headers:{"Content-Type":contentType},body:file})}
  catch(e){throw new ApiError("Could not upload the file directly to S3. Check bucket CORS and try again.")}
  if(!uploadResponse.ok)throw new ApiError(`S3 upload failed (${uploadResponse.status}). The resume remains pending; retry the upload.`)
  uploadSucceeded=true;
  const completion=await svc.completeResume(id);
  if(completion?.resume?.uploadStatus!=="uploaded")throw new ApiError("The server did not confirm the resume upload.")
  toast("Resume uploaded and verified.");
 }catch(e){
  S.resumeError=uploadSucceeded?`The file reached storage, but verification did not finish: ${e.message}`:e.message;
  toast(uploadSucceeded?"Resume upload needs verification: "+e.message:"Resume upload failed: "+e.message,"e");
 }finally{
  S.resumeBusy=false;S.resumeRetryId=null;await refreshResumes();
 }
}

  if(act=="open"&&t.tagName=="TR"&&e.target.closest("[data-noopen]"))return; // blank space in the row-actions cell should not open the row
  if(act=="closeov"&&e.target!==t&&!e.target.closest("button[data-act=closeov]"))return;
  if(act=="task")return;if(act=="eye"){const i=t.previousElementSibling;i.type=i.type=="password"?"text":"password";return}
  e.target.closest("a")&&e.preventDefault();
  if(act=="go"){S.page=t.dataset.p;S.nav=false;S.menu=null;S.open=null;S.pg=1}
  else if(act=="nav")S.nav=!S.nav;else if(act=="collapse")S.col=!S.col;else if(act=="route"){S.route=t.dataset.r;scrollTo(0,0)}else if(act=="demo"){S.route="app";S.page="dash"}else if(act=="scroll"){document.getElementById(t.dataset.s)?.scrollIntoView({behavior:"smooth"});return}else if(act=="ob"){const w=t.dataset.w;if(w=="back")S.obs--;else if(w=="next")S.obs++;else if(w=="skip"){S.route="app";S.page="dash"}else if(w=="add"||w=="empty"){S.obw=w;S.obs=3}else if(w=="fin"){S.route="app";S.page="dash";if(S.obw=="add")S.modal={type:"form"}}}else if(act=="navx")S.nav=false;
  else if(act=="menu")S.menu=S.menu==t.dataset.m?null:t.dataset.m;
  else if(act=="calendar-prev"||act=="calendar-next"){S.calendarMonth=new Date(S.calendarMonth.getFullYear(),S.calendarMonth.getMonth()+(act=="calendar-prev"?-1:1),1);S.calendarDate=dateKey(S.calendarMonth);S.calendarEvent=null}
  else if(act=="calendar-today"){const today=new Date();S.calendarMonth=new Date(today.getFullYear(),today.getMonth(),1);S.calendarDate=dateKey(today);S.calendarEvent=null}
  else if(act=="calendar-date"){S.calendarDate=t.dataset.date;S.calendarEvent=null}
  else if(act=="calendar-event")S.calendarEvent=id
  else if(act=="open-calendar-event"||act=="notification-open")openScheduledEvent(id)
  else if(act=="notification-filter")S.notificationFilter=t.dataset.filter
  else if(act=="notification-read"){if(S.readNotifications.has(id))S.readNotifications.delete(id);else S.readNotifications.add(id);persistNotificationReads()}
  else if(act=="notifications-read-all"){for(const item of scheduledEvents())S.readNotifications.add(item.id);persistNotificationReads()}
  else if(act=="theme"){Theme.toggle();S.menu=null}
  else if(act=="theme-choice")Theme.set(t.dataset.themeChoice);
  else if(act=="resumes-refresh")return refreshResumes();
  else if(act=="resume-retry"){const resume=S.resumes.find(r=>r.resumeId==id);if(!resume)return;S.resumeRetryId=id;S.resumeCategory=resume.roleCategory||""}
  else if(act=="resume-download"){await downloadResume(id);return}
  else if(act=="resume-delete"){const resume=S.resumes.find(r=>r.resumeId==id);if(resume)S.modal={type:"resume-del",data:resume}}
  else if(act=="resume-delete-confirm"){await deleteResume(id);return}
  else if(act=="add")S.modal={type:"form"};
  else if(act=="edit")S.modal={type:"form",data:S.apps.find(a=>a.id==id)};
  else if(act=="del")S.modal={type:"del",data:S.apps.find(a=>a.id==id)};
  else if(act=="delok"){await mutate("del:"+id,()=>svc.deleteApplication(id),{ok:"Application deleted",fail:"Delete failed",which:"both",done:()=>{S.modal=null;S.open=null}})}
  else if(act=="addtask")S.modal={type:"task",data:id?{applicationId:id}:undefined};
  else if(act=="edittask"){const k=S.tasks.find(x=>x.id==id);if(k)S.modal={type:"task",data:k}}
  else if(act=="deltask"){const k=S.tasks.find(x=>x.id==id);if(k)S.modal={type:"tdel",data:k}}
  else if(act=="tdelok"){await mutate("tdel:"+id,()=>svc.deleteTask(id),{ok:"Task deleted",fail:"Delete failed",which:"tasks",done:()=>{S.modal=null}})}
  else if(act=="open"){S.open=id;S.menu=null}
  else if(act=="closeov"){S.modal?S.modal=null:S.open=null}
  else if(act=="view"){S.view=t.dataset.v}
  else if(act=="pg")S.pg+=+t.dataset.d;
  else if(act=="clear"){S.q="";S.fs=S.fd=S.fl="all"}
  else if(act=="retry")return load();
  enter()});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id=="resume-file")return;
  if(t.dataset.act=="task"){const k=S.tasks.find(x=>x.id==t.dataset.id);if(!k)return;const done=t.checked;
   await mutate("task:"+k.id,()=>svc.updateTask(k.id,{...k,status:done?TASK_STATUS.done:TASK_STATUS.open}),{ok:done?"Task completed":"Task reopened",fail:"Couldn’t update task",which:"tasks"})}
  else if(t.dataset.act=="status"){const a=S.apps.find(x=>x.id==t.dataset.id);if(!a)return;const v=t.value;
   await mutate("status:"+a.id,()=>svc.updateApplication(a.id,{...a,status:v,dateApplied:a.dateApplied||(v!="saved"?day(0):"")}),{ok:"Status updated",fail:"Couldn’t update status",which:"apps"})}});
document.addEventListener("input",e=>{const k=e.target.dataset.in;if(!k)return;S[k]=e.target.value;if(k=="gq"){S.q=e.target.value;if(S.page!="apps"&&S.page!="dash")S.page="apps"}S.pg=1;render()});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,k=f.dataset.auth;if(k)auth(k,f);else if("resumeForm" in f.dataset){const file=f.elements.resumeFile.files?.[0];if(!file){S.resumeError="Choose a PDF or DOCX file.";render();return}const retryId=S.resumeRetryId;S.resumeRetryId=null;uploadResume(file,f.elements.roleCategory.value,retryId)}else if("tform" in f.dataset)saveTask(f.dataset.tform,f);else save(f.dataset.form,f)});
let dragId=null;
document.addEventListener("dragstart",e=>{dragId=e.target.closest?.("[data-drag]")?.dataset.drag});
document.addEventListener("dragover",e=>{const c=e.target.closest?.("[data-drop]");if(c){e.preventDefault();c.classList.add("over")}});
document.addEventListener("dragleave",e=>e.target.closest?.("[data-drop]")?.classList.remove("over"));
document.addEventListener("drop",async e=>{const c=e.target.closest?.("[data-drop]");if(!c||!dragId)return;e.preventDefault();c.classList.remove("over");
  const a=S.apps.find(x=>x.id==dragId),s=c.dataset.drop;dragId=null;if(!a||a.status==s)return render();
  await mutate("status:"+a.id,()=>svc.updateApplication(a.id,{...a,status:s,dateApplied:a.dateApplied||(s!="saved"?day(0):"")}),{ok:"Moved to "+ST[s],fail:"Couldn’t move application",which:"apps"})});
render(); // landing page first; API data loads only after entering the app
</script></body></html>
